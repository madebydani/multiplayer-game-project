<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><defs><radialGradient id="beam" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#FFE082" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFE082" stop-opacity="0"/>
    </radialGradient></defs>
    <!-- haz de la linterna (hacia delante) -->
    <polygon points="196,150 252,122 252,200" fill="url(#beam)"/>
    <!-- mochila (a la espalda = izquierda) -->
    <rect x="52" y="92" width="52" height="72" rx="16" fill="#9A6A40" stroke="#0D1410" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
