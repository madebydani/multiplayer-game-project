    <circle cx="150" cy="128" r="32" fill="#F2C7A0" stroke="#0D1410" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="170" cy="115" r="4.5" fill="#0D1410"/>
    <circle cx="170" cy="141" r="4.5" fill="#0D1410"/>
    <ellipse cx="180" cy="128" rx="4" ry="5" fill="#E8A87C"/>
