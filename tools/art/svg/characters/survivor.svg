    <circle cx="126" cy="128" r="31" fill="#4FC3F7" stroke="#0D1410" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <g stroke="#2B8FC0" stroke-width="4" stroke-linecap="round">
      <line x1="130" y1="128" x2="152" y2="110"/><line x1="130" y1="128" x2="155" y2="128"/><line x1="130" y1="128" x2="152" y2="146"/>
      <line x1="122" y1="128" x2="118" y2="100"/><line x1="122" y1="128" x2="118" y2="156"/><line x1="120" y1="128" x2="98" y2="128"/>
    </g>
    <path d="M148,104 Q160,128 148,152" fill="none" stroke="#F3E9D2" stroke-width="8" stroke-linecap="round"/>
    <circle cx="120" cy="128" r="12" fill="#F3E9D2" stroke="#0D1410" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
