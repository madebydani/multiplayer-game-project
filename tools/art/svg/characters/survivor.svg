    <line x1="96" y1="96" x2="120" y2="92" stroke="#0D1410" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="96" y1="160" x2="120" y2="164" stroke="#0D1410" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
