    <circle cx="180" cy="168" r="11" fill="#F2C7A0" stroke="#0D1410" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- hombros / cuerpo -->
    <ellipse cx="128" cy="128" rx="44" ry="58" fill="#F3E9D2" stroke="#0D1410" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- bufanda azul alrededor del cuello -->
    <path d="M150,92 Q170,128 150,164" fill="none" stroke="#4FC3F7" stroke-width="14" stroke-linecap="round"/>
    <path d="M150,92 Q170,128 150,164" fill="none" stroke="#0D1410" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>
